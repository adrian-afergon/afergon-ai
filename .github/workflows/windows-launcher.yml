name: Windows launcher

on:
  pull_request:
  push:

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows TypeScript compiler bootstrap before workflow build
        run: pnpm exec vitest run tests/windows-typescript-build-bootstrap.test.ts --no-file-parallelism
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run health:runtime
      - name: Verify Windows CMD argv contract
        shell: bash
        run: pnpm exec vitest run tests/windows-launcher-argv.test.ts --no-file-parallelism
      - name: Verify Windows OpenCode scripts
        shell: bash
        run: pnpm exec vitest run tests/windows-opencode-scripts.test.ts --no-file-parallelism
      - name: Smoke the built Windows launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $helpOutput = & .\bin\afergon-ai.cmd --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "afergon-ai.cmd --help exited with $LASTEXITCODE" }
          $helpText = $helpOutput -join "`n"
          if ($helpText -notmatch [regex]::Escape("Usage:")) { throw "afergon-ai.cmd --help did not print usage" }
          if ($helpText -notmatch [regex]::Escape("afergon-ai tui")) { throw "afergon-ai.cmd --help did not document the TUI command" }

           $errorOutput = & .\bin\afergon-ai.cmd not-a-command 2>&1
           if ($LASTEXITCODE -ne 1) { throw "afergon-ai.cmd unknown command exited with $LASTEXITCODE" }
           if (($errorOutput -join "`n") -notmatch [regex]::Escape("Unknown command: not-a-command")) { throw "afergon-ai.cmd unknown command did not print the expected error" }

           $env:PATH = "$PWD\bin;$env:PATH"
           $doctorOutput = & .\bin\afergon-ai.cmd doctor 2>&1
           if ($LASTEXITCODE -ne 0) { throw "afergon-ai.cmd doctor exited with $LASTEXITCODE" }
           if (($doctorOutput -join "`n") -notmatch [regex]::Escape("Scripts requeridos presentes.")) { throw "afergon-ai.cmd doctor did not run the Windows verifier" }
